name: Build Android Release AAB
# Build signed AAB for Google Play Store

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK Command Line Tools
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: '11076708' # Specific version for stability
        
    - name: Accept Android SDK licenses first
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        
    - name: Install Android SDK components
      run: |
        echo "Installing Android SDK components..."
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34"
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;34.0.0"
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools"
        
    - name: Verify Android SDK installation
      run: |
        echo "Verifying Android SDK installation..."
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed
        echo "ANDROID_HOME: $ANDROID_HOME"
        ls -la $ANDROID_HOME/ || true

    - name: Create keystore from secrets
      working-directory: android
      run: |
        echo "$ANDROID_KEYSTORE_B64" | base64 --decode > ducharha-release-key.keystore
        ls -la ducharha-release-key.keystore

    - name: Build client assets
      run: |
        npm ci
        npm run build

    - name: Remove old Capacitor config and regenerate
      run: |
        echo "Removing old Capacitor auto-generated files..."
        rm -f android/capacitor.settings.gradle
        rm -f android/app/capacitor.build.gradle
        echo "Syncing Capacitor with Android..."
        npx cap sync android
        echo "Verifying Capacitor files were generated..."
        if [ ! -f "android/capacitor.settings.gradle" ]; then
          echo "ERROR: capacitor.settings.gradle not generated!"
          exit 1
        fi
        if [ ! -f "android/app/capacitor.build.gradle" ]; then
          echo "ERROR: capacitor.build.gradle not generated!"
          exit 1
        fi
        echo "✅ Capacitor files generated successfully"
        cat android/capacitor.settings.gradle
        cat android/app/capacitor.build.gradle

    - name: Setup Android local.properties
      working-directory: android
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        cat local.properties

    - name: Update gradle.properties with CI settings
      working-directory: android
      run: |
        echo "Updating gradle.properties with CI-optimized settings..."
        cat >> gradle.properties << 'EOF'

# CI/CD optimized Gradle settings
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false
org.gradle.workers.max=2
EOF
        echo "Updated gradle.properties:"
        cat gradle.properties

    - name: Setup Gradle wrapper
      working-directory: android
      run: |
        chmod +x gradlew
        echo "Gradle wrapper properties:"
        cat gradle/wrapper/gradle-wrapper.properties
        echo "Clearing ALL Gradle caches to force version update..."
        rm -rf ~/.gradle/
        rm -rf .gradle/
        echo "Verifying Gradle version will be downloaded fresh..."
        ./gradlew --version || echo "Will download on first build"

    - name: Clean and build release AAB
      working-directory: android
      run: |
        echo "Building Android AAB..."
        echo "Gradle version:"
        ./gradlew --version
        echo "Starting clean build..."
        ./gradlew clean --no-daemon --stacktrace --info --no-configuration-cache --no-build-cache --no-parallel
        echo "Building release AAB..."
        ./gradlew bundleRelease --no-daemon --stacktrace --info --no-configuration-cache --no-build-cache --no-parallel --refresh-dependencies

    - name: List build outputs
      working-directory: android
      run: |
        echo "Build outputs:"
        find app/build/outputs -name "*.aab" -type f
        ls -la app/build/outputs/bundle/release/ || echo "Release directory not found"

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: android/app/build/outputs/bundle/release/app-release.aab
        retention-days: 30

    - name: Verify AAB signature
      working-directory: android
      run: |
        if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
          echo "AAB file created successfully:"
          ls -la app/build/outputs/bundle/release/app-release.aab
          echo "Verifying keystore signature (using variables):"
          echo " - alias: ${ANDROID_KEY_ALIAS}"
          # Actual verification
          keytool -list -v \
            -keystore ducharha-release-key.keystore \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD"
        else
          echo "AAB file not found!"
          exit 1
        fi

    - name: Copy AAB to public directory
      run: |
        mkdir -p server/public
        cp android/app/build/outputs/bundle/release/app-release.aab server/public/app-release.aab
        echo "✅ AAB copied to server/public/app-release.aab"
        
    - name: Commit and push AAB to repository
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add server/public/app-release.aab
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "🤖 Auto-update AAB release build [skip ci]"
          git push
          echo "✅ AAB pushed to repository - triggering Render redeploy"
        fi

    - name: Clean up keystore
      working-directory: android
      if: always()
      run: |
        rm -f ducharha-release-key.keystore
        echo "Keystore cleaned up"