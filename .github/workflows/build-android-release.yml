name: Build Android Release AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'client/**'
      - '.github/workflows/build-android-release.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'client/**'
      - '.github/workflows/build-android-release.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # УБРАНО: env переменные для подписи, так как подпись теперь делается через r0adkll/sign-android-release action
    # env:
    #   ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    #   ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    #   ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    #   ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK Command Line Tools
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: '11076708' # Specific version for stability
        
    - name: Accept Android SDK licenses first
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        
    - name: Install Android SDK components
      run: |
        echo "Installing Android SDK components..."
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34"
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;34.0.0"
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools"
        
    - name: Verify Android SDK installation
      run: |
        echo "Verifying Android SDK installation..."
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed
        echo "ANDROID_HOME: $ANDROID_HOME"
        ls -la $ANDROID_HOME/ || true

    # ЗАКОММЕНТИРОВАНО: Старый метод создания keystore вручную
    # - name: Create keystore from secrets
    #   working-directory: android
    #   run: |
    #     echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/ducharha-release-keystore
    #     ls -la app/ducharha-release-keystore

    - name: Build client assets
      run: |
        npm ci
        npm run build

    - name: Sync Capacitor with Android
      run: npx cap sync android

    - name: Setup Android local.properties
      working-directory: android
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        cat local.properties

    - name: Setup Gradle wrapper
      working-directory: android
      run: |
        chmod +x gradlew
        echo "Gradle wrapper properties:"
        cat gradle/wrapper/gradle-wrapper.properties
        echo "Clearing Gradle cache to force version update..."
        rm -rf ~/.gradle/caches/
        rm -rf ~/.gradle/wrapper/

    - name: Clean and build release AAB
      working-directory: android
      run: |
        echo "Building Android AAB..."
        echo "Gradle version:"
        ./gradlew --version
        echo "Starting clean build..."
        ./gradlew clean --no-daemon --stacktrace --info
        echo "Building release AAB..."
        ./gradlew bundleRelease --no-daemon --stacktrace --info --no-parallel --refresh-dependencies

    - name: Sign Android Release
      uses: r0adkll/sign-android-release@v1.0.3
      id: sign_app
      with:
        releaseDirectory: android/app/build/outputs/bundle/release
        signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        alias: ${{ secrets.ANDROID_KEY_ALIAS }}
        keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

    - name: List build outputs
      working-directory: android
      run: |
        echo "Build outputs:"
        find app/build/outputs -name "*.aab" -type f
        ls -la app/build/outputs/bundle/release/ || echo "Release directory not found"

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: android/app/build/outputs/bundle/release/app-release.aab
        retention-days: 30

    - name: Copy AAB to public directory
      run: |
        mkdir -p server/public
        cp android/app/build/outputs/bundle/release/app-release.aab server/public/app-release.aab
        echo "✅ AAB copied to server/public/app-release.aab"
        
    - name: Commit and push AAB to repository
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add server/public/app-release.aab
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "🤖 Auto-update AAB release build [skip ci]"
          git push --force-with-lease
          echo "✅ AAB pushed to repository - triggering Render redeploy"
        fi