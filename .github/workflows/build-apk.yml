name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install dependencies
      run: npm ci

    - name: Build web application
      run: npm run build

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Append CI settings to gradle.properties
      run: |
        echo "" >> android/gradle.properties
        echo "# CI Build Settings" >> android/gradle.properties
        echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties
        echo "org.gradle.daemon=false" >> android/gradle.properties
        echo "org.gradle.caching=false" >> android/gradle.properties

    - name: Make Gradlew executable
      run: chmod +x android/gradlew

    - name: Build Debug APK
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Copy APK to releases folder
      run: |
        mkdir -p releases
        cp android/app/build/outputs/apk/debug/app-debug.apk releases/app-debug.apk

    - name: Upload to releases
      uses: actions/upload-artifact@v4
      with:
        name: ducharkha-debug-apk
        path: releases/app-debug.apk
        retention-days: 90
