name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'client/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK Command Line Tools
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: '11076708' # Specific version for stability
        
    - name: Accept Android licenses first
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        
    - name: Install Android SDK components
      run: |
        echo "Installing Android SDK components..."
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34"
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;34.0.0"
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools"
        
    - name: Verify Android SDK installation
      run: |
        echo "Verifying Android SDK installation..."
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed
        echo "ANDROID_HOME: $ANDROID_HOME"
        ls -la $ANDROID_HOME/ || true
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build web client
      run: npm run build
      
    - name: Sync Capacitor with Android
      run: |
        echo "Syncing Capacitor with Android..."
        npx cap sync android --deployment
        npx cap copy android
        echo "Verifying Capacitor files were generated..."
        ls -la android/capacitor.settings.gradle || echo "ERROR: capacitor.settings.gradle not generated!"
        ls -la android/app/capacitor.build.gradle || echo "ERROR: capacitor.build.gradle not generated!"
        echo "Checking Capacitor plugin directories..."
        ls -la node_modules/@capacitor/android/capacitor/ || true
        ls -la node_modules/@capacitor/app/android/ || true
        ls -la node_modules/@capacitor/geolocation/android/ || true
      
    - name: Setup Android local.properties
      working-directory: android
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        cat local.properties
        
    - name: Create CI-optimized gradle.properties
      working-directory: android
      run: |
        echo "Creating CI-optimized gradle.properties..."
        cat > gradle.properties.ci << 'EOF'
        # CI/CD optimized Gradle settings
        org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
        org.gradle.daemon=false
        org.gradle.parallel=false
        org.gradle.caching=false
        org.gradle.configuration-cache=false
        org.gradle.workers.max=2
        android.useAndroidX=true
        android.enableJetifier=true
        android.suppressUnsupportedCompileSdk=true
        android.suppressUnsupportedOptionWarnings=true
        org.gradle.warning.mode=none
        EOF
        mv gradle.properties gradle.properties.bak
        mv gradle.properties.ci gradle.properties
        echo "New gradle.properties for CI:"
        cat gradle.properties
        
    - name: Setup Gradle wrapper
      working-directory: android
      run: |
        chmod +x gradlew
        echo "Gradle wrapper properties:"
        cat gradle/wrapper/gradle-wrapper.properties
        echo "Clearing Gradle cache and configuration cache..."
        rm -rf ~/.gradle/caches/
        rm -rf ~/.gradle/wrapper/
        rm -rf .gradle/
        ./gradlew --stop
        
    - name: Clean and build Android APK
      working-directory: android
      run: |
        echo "Building Android APK..."
        echo "Java version in use:"
        java -version
        echo "Gradle version:"
        ./gradlew --version
        echo "Gradle JVM args:"
        ./gradlew -q javaToolchains
        echo "Starting clean build..."
        ./gradlew clean --no-daemon --stacktrace --no-configuration-cache --no-build-cache --no-parallel
        echo "Building debug APK..."
        ./gradlew assembleDebug --no-daemon --stacktrace --no-configuration-cache --no-build-cache --no-parallel --refresh-dependencies
        
    - name: Verify APK was created
      run: |
        if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "✅ APK created successfully"
          ls -la android/app/build/outputs/apk/debug/
        else
          echo "❌ APK not found"
          ls -la android/app/build/outputs/ || echo "Build outputs directory not found"
          exit 1
        fi
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
    - name: Copy APK to public directory with correct name
      run: |
        mkdir -p server/public
        cp android/app/build/outputs/apk/debug/app-debug.apk server/public/app-debug.apk
        echo "✅ APK copied to server/public/app-debug.apk"
        
    - name: Commit and push APK to repository
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add server/public/app-debug.apk
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "🤖 Auto-update APK build [skip ci]"
          git push
          echo "✅ APK pushed to repository - triggering Render redeploy"
        fi