name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'client/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK Command Line Tools
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: '11076708' # Specific version for stability
        
    - name: Install Android SDK components  
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34"
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0"
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools"
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1"
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"
        
    - name: Accept Android licenses
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build web client
      run: npm run build
      
    - name: Setup Gradle wrapper
      working-directory: android
      run: |
        chmod +x gradlew
        echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> gradle.properties
        echo "org.gradle.parallel=false" >> gradle.properties
        echo "org.gradle.daemon=false" >> gradle.properties
      
    - name: Build Android APK
      working-directory: android
      run: |
        echo "Building Android APK..."
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        ./gradlew clean --no-daemon --stacktrace --info
        ./gradlew assembleDebug --no-daemon --stacktrace --info --no-parallel
        
    - name: Verify APK was created
      run: |
        if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "✅ APK created successfully"
          ls -la android/app/build/outputs/apk/debug/
        else
          echo "❌ APK not found"
          ls -la android/app/build/outputs/ || echo "Build outputs directory not found"
          exit 1
        fi
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
    - name: Copy APK to public directory with correct name
      run: |
        mkdir -p server/public
        cp android/app/build/outputs/apk/debug/app-debug.apk server/public/app-debug.apk
        echo "✅ APK copied to server/public/app-debug.apk"
        
    - name: Commit and push APK to repository
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add server/public/app-debug.apk
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "🤖 Auto-update APK build [skip ci]"
          git push
          echo "✅ APK pushed to repository - triggering Render redeploy"
        fi