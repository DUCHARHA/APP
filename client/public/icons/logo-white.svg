<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Purple background -->
  <rect width="512" height="512" fill="#5B21B6"/>
  
  <!-- Heart with infinity symbol (white) -->
  <g transform="translate(256, 256)">
    <!-- Heart shape -->
    <path d="M 0,-40 C -20,-60 -50,-60 -70,-40 C -90,-20 -90,10 -70,30 L 0,100 L 70,30 C 90,10 90,-20 70,-40 C 50,-60 20,-60 0,-40 Z" 
          fill="white" 
          transform="translate(0, -30) scale(1.5)"/>
    
    <!-- Infinity symbol -->
    <path d="M -60,0 C -60,-20 -40,-30 -20,-30 C 0,-30 10,-20 20,-10 C 30,0 40,0 60,0 C 80,0 90,-10 90,-30 C 90,-50 70,-60 50,-60 C 30,-60 10,-50 0,-40 C -10,-50 -30,-60 -50,-60 C -70,-60 -90,-50 -90,-30 C -90,-10 -80,0 -60,0 Z M -60,0 C -60,20 -40,30 -20,30 C 0,30 10,20 20,10 C 30,0 40,0 60,0 C 80,0 90,10 90,30 C 90,50 70,60 50,60 C 30,60 10,50 0,40 C -10,50 -30,60 -50,60 C -70,60 -90,50 -90,30 C -90,10 -80,0 -60,0 Z" 
          fill="white" 
          transform="translate(0, 60) scale(0.8)"/>
  </g>
</svg>
