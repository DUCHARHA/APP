<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Purple background -->
  <rect width="512" height="512" fill="#5B21B6"/>
  
  <!-- White heart with infinity symbol -->
  <g transform="translate(256, 200)">
    <!-- Heart shape -->
    <path d="M 0 20 
             C -30 -10, -80 -10, -90 20
             C -100 50, -90 80, -50 120
             L 0 170
             L 50 120
             C 90 80, 100 50, 90 20
             C 80 -10, 30 -10, 0 20 Z" 
          fill="white"/>
  </g>
  
  <!-- Infinity symbol below heart -->
  <g transform="translate(256, 380)">
    <!-- Infinity path -->
    <path d="M -80 0
             C -80 -35, -50 -50, -30 -50
             C -10 -50, 5 -35, 20 -15
             C 35 5, 50 15, 70 15
             C 90 15, 110 0, 110 -30
             C 110 -60, 85 -80, 60 -80
             C 35 -80, 15 -65, 0 -50
             C -15 -65, -35 -80, -60 -80
             C -85 -80, -110 -60, -110 -30
             C -110 0, -90 15, -70 15
             C -50 15, -35 5, -20 -15
             C -5 -35, 10 -50, 30 -50
             C 50 -50, 80 -35, 80 0
             C 80 35, 50 50, 30 50
             C 10 50, -5 35, -20 15
             C -35 -5, -50 -15, -70 -15
             C -90 -15, -110 0, -110 30
             C -110 60, -85 80, -60 80
             C -35 80, -15 65, 0 50
             C 15 65, 35 80, 60 80
             C 85 80, 110 60, 110 30
             C 110 0, 90 -15, 70 -15
             C 50 -15, 35 -5, 20 15
             C 5 35, -10 50, -30 50
             C -50 50, -80 35, -80 0 Z"
          fill="white"/>
  </g>
</svg>
